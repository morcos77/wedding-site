
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M ♡ E | Our Wedding</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<!-- ENVELOPE SCREEN -->
<div id="envelope-screen">

    <div class="envelope-wrapper">

        <div class="envelope" id="envelope">

            <!-- Invitation card -->
            <div class="invitation-card">
                <div class="card-logo">M <span>♥</span> E</div>
                <div class="card-title">Our Wedding</div>
                <div class="card-date">27 February 2027</div>
            </div>

            <!-- Envelope back -->
            <div class="envelope-back"></div>

            <!-- Envelope flap -->
            <div class="envelope-flap"></div>

            <!-- Envelope front -->
            <div class="envelope-front"></div>

        </div>

        <button class="open-button" onclick="openEnvelope(event)">
            OPEN INVITATION
        </button>

    </div>

</div>


<!-- DECORATION -->
<img src="images/gif_flower_1.gif" class="decor-gif top-left">
<img src="images/gif_butterflys.gif" class="decor-gif bottom-right">


<!-- HERO -->
<section class="hero">

    <img src="images/main.jpeg" class="hero-bg">

    <div class="overlay"></div>

    <div class="hero-content">

        <img src="images/names.png" class="names-image">

        <img src="images/nameanddate.png" class="date-image">

        <p class="countdown-title">
            Counting the days until our special day
        </p>

        <div class="countdown">

            <div class="flip-card">
                <span id="days">00</span>
                <label>Days</label>
            </div>

            <div class="flip-card">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>

            <div class="flip-card">
                <span id="mins">00</span>
                <label>Minutes</label>
            </div>

        </div>

        <button class="qr-btn" onclick="triggerConfetti()">
            View QR Code
        </button>

    </div>

</section>


<!-- INFORMATION -->
<section class="section">

    <div class="card">

        <h2>⛪ Ceremony</h2>

        <p>St. John Church</p>

        <a href="URL_CHIESA"
           target="_blank"
           class="map-link">
           📍 View on Maps
        </a>

    </div>


    <div class="card">

        <h2>🎉 Reception</h2>

        <p>Almasa Hall</p>

        <a href="URL_SALA"
           target="_blank"
           class="map-link">
           📍 View on Maps
        </a>

    </div>


    <div class="card">

        <h2>💌 Send a Message</h2>

        <form action="URL_FORMSPREE" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Your Name"
                class="input-field"
                required
            >

            <textarea
                name="message"
                placeholder="Write a message..."
                class="input-field"
                required
            ></textarea>

            <button type="submit" class="submit-btn">
                Send Message
            </button>

        </form>

    </div>


    <div class="card">

        <h2>📸 Gallery</h2>

        <p>Share your photos with us!</p>

        <a
            href="https://docs.google.com/forms/d/e/1FAIpQLSeTGxKjUz-BYHdLkFZAeTj0hFAWEx0BnJthh9v2BviZJf6H5Q/viewform"
            target="_blank"
            class="submit-btn"
        >
            Upload Photos
        </a>

    </div>

</section>


<!-- QR POPUP -->
<div id="qr-popup" class="qr-popup" onclick="closeQR()">

    <div class="qr-content" onclick="event.stopPropagation()">

        <img src="images/qr.png" alt="QR Code">

        <button class="close-btn" onclick="closeQR()">
            ✕ Close
        </button>

    </div>

</div>


<!-- FINAL -->
<section class="final-section">

    <div class="final-names">

        <span class="final-m">M</span>

        <span class="final-heart">♥</span>

        <span class="final-e">E</span>

    </div>

    <p>27 February 2027</p>

</section>


<script src="script.js"></script>

</body>
</html>
